name: "Termius Interactive SSH Runner with mouse scrolling"

on:
  workflow_dispatch:
    inputs:
      discord_webhook:
        description: "Discord Webhook URL (optional, to receive instant connect alert)"
        required: false
        type: string
        default: ""

jobs:
  ssh-session:
    name: "Interactive Termius SSH Terminal"
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job limit: 6 hours

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Display Runner System Specs"
        run: |
          echo "=========================================================="
          echo "💻 GitHub Actions Runner VM Ready for Termius Connection"
          echo "   OS: $(lsb_release -d 2>/dev/null | cut -f2 || uname -s)"
          echo "   CPU Cores: $(nproc)"
          echo "   Total RAM: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "   Disk Space: $(df -h / | awk 'NR==2 {print $4}') available"
          echo "=========================================================="

      - name: "Verify tmux is available"
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            echo "tmux not found, installing..."
            sudo apt-get update -qq && sudo apt-get install -y tmux
          fi
          tmux -V

      - name: "Write tmux scrollback config"
        run: |
          cat > /tmp/tmux-scroll.conf <<'EOF'
          # ================= tmux scrollback / UX config =================
          # Big history buffer (scroll back up to 100k lines)
          set -g history-limit 100000

          # Enable mouse: wheel = scroll, drag = select, click = focus
          set -g mouse on

          # vi-style keys inside copy mode
          setw -g mode-keys vi

          # Wheel events: enter copy-mode and scroll (works on tmux 2.1+)
          bind -n WheelUpPane   if-shell -F -t = "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -M"
          bind -n WheelDownPane send-keys -M

          # Scroll 5 lines per wheel notch inside copy-mode (feels natural)
          bind -T copy-mode-vi WheelUpPane   send-keys -X -N 5 scroll-up
          bind -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down

          # Status bar with live scrollback counter
          set -g status on
          set -g status-interval 5
          set -g status-right '#[fg=green]%H:%M #[fg=cyan]| hist: #{history_size}/#{history_limit} '
          set -g status-left  '#[fg=yellow][termius] '

          # Nicer base indexing
          set -g base-index 1
          set -g pane-base-index 1

          # Prevent accidental detach on Ctrl-b d from inside editors
          # (comment out if you don't want this)
          # unbind C-b
          # set -g prefix C-a
          # bind C-a send-prefix

          # Faster escape (less lag in vim)
          set -sg escape-time 10

          # 256 color + true color
          set -g default-terminal "screen-256color"
          set -ga terminal-overrides ",*256col*:Tc"
          # ===============================================================
          EOF
          echo "✅ tmux config written to /tmp/tmux-scroll.conf"
          echo "--- config preview ---"
          cat /tmp/tmux-scroll.conf

      - name: "Launch Termius SSH Tunnel (Upterm + tmux scrollback)"
        uses: owenthereal/action-upterm@v1
        id: upterm
        with:
          detached: true
          limit-access-to-actor: false
          command: tmux new -A -s termius -c /tmp/tmux-scroll.conf

      - name: "Format Termius Details & Send Notifications"
        env:
          INPUT_DISCORD: ${{ github.event.inputs.discord_webhook }}
          SECRET_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SSH_CMD: ${{ steps.upterm.outputs.ssh-command }}
        run: |
          DISCORD_WEBHOOK="${INPUT_DISCORD:-$SECRET_DISCORD}"

          # Parse SSH Command (format: ssh user@host)
          RAW_ADDR=$(echo "$SSH_CMD" | sed -e 's/^ssh //')
          SSH_USER=$(echo "$RAW_ADDR" | cut -d'@' -f1)
          SSH_HOST=$(echo "$RAW_ADDR" | cut -d'@' -f2)
          SSH_PORT="22"

          # ====================================================================
          # SECURITY: If Discord Webhook is provided, hide credentials from logs!
          # ====================================================================
          if [ -n "$DISCORD_WEBHOOK" ]; then
            # Mask user and command from public logs
            echo "::add-mask::$SSH_USER"
            echo "::add-mask::$SSH_CMD"

            echo ""
            echo "=========================================================="
            echo "🔒 SECURE MODE ACTIVE (Public Repo Protection)"
            echo "=========================================================="
            echo "   ✅ Upterm SSH Tunnel established successfully."
            echo "   📨 Full Termius connection details sent to Discord!"
            echo "   🛡️ Credentials and session tokens are HIDDEN from logs"
            echo "      to prevent strangers on GitHub from hijacking your runner."
            echo "=========================================================="
            echo ""

            # Write safe masked summary to GitHub
            echo "### 🔒 Secure Session Active" >> "$GITHUB_STEP_SUMMARY"
            echo "Connection credentials have been securely dispatched to your **Discord webhook**." >> "$GITHUB_STEP_SUMMARY"
            echo "> 🛡️ Details are masked in public logs to keep your runner safe from unauthorized access." >> "$GITHUB_STEP_SUMMARY"

            # Send private details directly to Discord
            # NOTE: Discord content uses backtick code spans so credentials are
            # easy to copy on mobile Termius. Escaped JSON is built with jq to
            # avoid breakage on special characters.
            if command -v jq >/dev/null 2>&1; then
              PAYLOAD=$(jq -n \
                --arg host "$SSH_HOST" \
                --arg port "$SSH_PORT" \
                --arg user "$SSH_USER" \
                --arg cmd  "$SSH_CMD" \
                '{content: ("🚀 **GitHub Actions Termius SSH Node Ready!**\n\n**Host:** `" + $host + "`\n**Port:** `" + $port + "`\n**User:** `" + $user + "`\n**Password:** *(Leave empty)*\n**Full Command:**\n```" + $cmd + "```\n\n_Scrolling:_ mouse wheel to scroll · `Ctrl-b [` to enter copy mode · `q` to exit")}')
            else
              # Fallback if jq is missing (shouldn't be on ubuntu-latest)
              PAYLOAD="{\"content\":\"🚀 **GitHub Actions Termius SSH Node Ready!**\\n\\n**Host:** \`$SSH_HOST\`\\n**Port:** \`$SSH_PORT\`\\n**User:** \`$SSH_USER\`\\n**Password:** *(Leave empty)*\\n**Full Command:**\\n\`$SSH_CMD\`\"}"
            fi

            curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" >/dev/null || true

          else
            # Fallback if no Discord webhook provided
            echo ""
            echo "=========================================================="
            echo "⚠️  WARNING: NO DISCORD WEBHOOK PROVIDED"
            echo "=========================================================="
            echo "   Hostname / IP: $SSH_HOST"
            echo "   Port:          $SSH_PORT"
            echo "   Username:      $SSH_USER"
            echo "   Password:      (Leave Empty)"
            echo "   Full Command:  $SSH_CMD"
            echo "=========================================================="
            echo "👉 TIP: Provide a discord_webhook input next time to hide"
            echo "   these credentials completely from public GitHub logs!"
            echo "=========================================================="
            echo ""

            # Add exact Termius fields to Step Summary
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📱 Enter these exact fields in Termius:" >> "$GITHUB_STEP_SUMMARY"
            echo "| Termius Field | Value to Enter |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Hostname / IP | \`$SSH_HOST\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Port | \`$SSH_PORT\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Username | \`$SSH_USER\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Password | *(Leave empty)* |" >> "$GITHUB_STEP_SUMMARY"
            echo "| SSH Key | *(None)* |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⏳ Session Lifetime: Up to 6 hours. To disconnect and stop the runner, type \`touch /tmp/keepalive_stop\` or cancel the run." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 🖱️ Scrolling inside the session" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Mouse wheel** = scroll up/down (100,000 line history)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **\`Ctrl-b [\`** = enter copy mode · \`k/j\` scroll · \`/\` search · \`q\` exit" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status bar shows live \`hist: used/limit\` counter" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "⏳ Runner is now listening. Waiting for your SSH connection..."
          # Keep runner alive for up to 6 hours or until stopped
          while pgrep -f upterm >/dev/null && [ ! -f /tmp/keepalive_stop ]; do
            sleep 10
          done
          echo "Session finished."
