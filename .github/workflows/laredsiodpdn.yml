name: "Clean SSH Runner (Pinggy - Username & Password)"

on:
  workflow_dispatch:
    inputs:
      ssh_password:
        description: "SSH Password for runner user (leave blank for random)"
        required: false
        type: string
        default: ""
      discord_webhook:
        description: "Discord Webhook URL (optional, to receive instant connect alert)"
        required: false
        type: string
        default: ""

jobs:
  ssh-session:
    name: "Clean Password SSH Terminal"
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job limit: 6 hours

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Display Runner System Specs"
        run: |
          echo "=========================================================="
          echo "💻 GitHub Actions Runner VM Ready for Termius Connection"
          echo "   OS: $(lsb_release -d 2>/dev/null | cut -f2 || uname -s)"
          echo "   CPU Cores: $(nproc)"
          echo "   Total RAM: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "   Disk Space: $(df -h / | awk 'NR==2 {print $4}') available"
          echo "=========================================================="

      - name: "Configure Standard OpenSSH Server"
        id: ssh_setup
        run: |
          # 1. Generate or set custom SSH password
          INPUT_PASS="${{ github.event.inputs.ssh_password }}"
          if [ -z "$INPUT_PASS" ]; then
            SSH_PASS=$(openssl rand -hex 6)
          else
            SSH_PASS="$INPUT_PASS"
          fi
          
          # Set password for runner user
          echo "runner:$SSH_PASS" | sudo chpasswd
          echo "::add-mask::$SSH_PASS"
          echo "ssh_password=$SSH_PASS" >> "$GITHUB_OUTPUT"

          # 2. Enable Password Authentication in sshd
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*ChallengeResponseAuthentication.*/ChallengeResponseAuthentication yes/' /etc/ssh/sshd_config
          
          # Ensure ssh service is started
          sudo systemctl restart ssh || sudo service ssh restart
          echo "✅ OpenSSH server configured with password login enabled."

      - name: "Launch Pinggy TCP Tunnel & Format Termius Details"
        env:
          SSH_PASS: ${{ steps.ssh_setup.outputs.ssh_password }}
          INPUT_DISCORD: ${{ github.event.inputs.discord_webhook }}
          SECRET_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DISCORD_WEBHOOK="${INPUT_DISCORD:-$SECRET_DISCORD}"

          echo "🚀 Starting Pinggy TCP Tunnel on port 22..."
          
          # Pinggy web debugger provides connection info locally on port 4300
          # Launch pinggy tunnel in background saving output
          mkfifo /tmp/pinggy_pipe 2>/dev/null || true
          
          # Run pinggy tunnel
          ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:22 tcp@free.pinggy.io > /tmp/pinggy.log 2>&1 &
          PINGGY_PID=$!

          # Wait for Pinggy to output connection string (up to 20 seconds)
          echo "Waiting for Pinggy public TCP host and port..."
          SSH_HOST=""
          SSH_PORT=""
          for i in {1..20}; do
            sleep 1
            # Pinggy outputs: tcp://<host>:<port>
            RAW_LINE=$(grep -oE "tcp://[a-zA-Z0-9.-]+:[0-9]+" /tmp/pinggy.log | head -n 1 || true)
            if [ -n "$RAW_LINE" ]; then
              # Strip tcp:// prefix first, then extract host and port cleanly
              CLEAN_ADDR="${RAW_LINE#tcp://}"
              SSH_HOST="${CLEAN_ADDR%:*}"
              SSH_PORT="${CLEAN_ADDR##*:}"
              break
            fi
            
            # Alternative format: ssh -p <port> ...@<host>
            RAW_LINE2=$(grep -oE "ssh -p [0-9]+ .*@[a-zA-Z0-9.-]+" /tmp/pinggy.log | head -n 1 || true)
            if [ -n "$RAW_LINE2" ]; then
              SSH_PORT=$(echo "$RAW_LINE2" | awk '{print $3}')
              SSH_HOST=$(echo "$RAW_LINE2" | awk '{print $4}' | cut -d'@' -f2)
              break
            fi
          done

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ]; then
            echo "⚠️ Could not parse from log directly. Checking raw output:"
            cat /tmp/pinggy.log
          fi

          # ====================================================================
          # SECURITY: If Discord Webhook is provided, hide credentials from logs!
          # ====================================================================
          if [ -n "$DISCORD_WEBHOOK" ]; then
            # Mask host and port from public logs
            echo "::add-mask::$SSH_HOST"
            echo "::add-mask::$SSH_PORT"

            echo ""
            echo "=========================================================="
            echo "🔒 SECURE MODE ACTIVE (Public Repo Protection)"
            echo "=========================================================="
            echo "   ✅ SSH Tunnel established successfully."
            echo "   📨 Full connection details sent privately to your Discord!"
            echo "   🛡️ Host, Port, and Password are HIDDEN from these logs"
            echo "      to prevent strangers on GitHub from hijacking your runner."
            echo "=========================================================="
            echo ""

            # Write safe masked summary to GitHub
            echo "### 🔒 Secure Session Active" >> "$GITHUB_STEP_SUMMARY"
            echo "Connection credentials have been securely dispatched to your **Discord webhook**." >> "$GITHUB_STEP_SUMMARY"
            echo "> 🛡️ Details are masked in public logs to keep your runner safe from unauthorized access." >> "$GITHUB_STEP_SUMMARY"

            # Send private details directly to Discord
            curl -s -H "Content-Type: application/json" -X POST -d "{
              \"content\": \"🚀 **Clean Password SSH Ready! (Termius)**\\n\\n**Host:** \`$SSH_HOST\`\\n**Port:** \`$SSH_PORT\`\\n**User:** \`runner\`\\n**Password:** \`$SSH_PASS\`\\n**Full Command:**\\n\`ssh runner@$SSH_HOST -p $SSH_PORT\`\"
            }" "$DISCORD_WEBHOOK" >/dev/null || true

          else
            # Fallback if no Discord webhook provided
            echo ""
            echo "=========================================================="
            echo "⚠️  WARNING: NO DISCORD WEBHOOK PROVIDED"
            echo "=========================================================="
            echo "   Hostname / IP: $SSH_HOST"
            echo "   Port:          $SSH_PORT"
            echo "   Username:      runner"
            echo "   Password:      $SSH_PASS"
            echo "   Full Command:  ssh runner@$SSH_HOST -p $SSH_PORT"
            echo "=========================================================="
            echo "👉 TIP: Provide a discord_webhook input next time to hide"
            echo "   these credentials completely from public GitHub logs!"
            echo "=========================================================="
            echo ""

            echo "### 📱 Enter these exact fields in Termius:" >> "$GITHUB_STEP_SUMMARY"
            echo "| Termius Field | Value to Enter |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Hostname / IP** | \`$SSH_HOST\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Port** | \`$SSH_PORT\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Username** | \`runner\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Password** | \`$SSH_PASS\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "⏳ Runner is now listening. Waiting for your SSH connection..."
          # Keep runner alive for up to 6 hours or until stopped
          while kill -0 "$PINGGY_PID" 2>/dev/null && [ ! -f /tmp/keepalive_stop ]; do
            sleep 10
          done
          echo "Session finished."
