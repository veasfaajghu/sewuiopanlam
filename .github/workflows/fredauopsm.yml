name: "Termius Interactive SSH Runner"

on:
  workflow_dispatch:
    inputs:
      discord_webhook:
        description: "Discord Webhook URL (optional, to receive instant connect alert)"
        required: false
        type: string
        default: ""

jobs:
  ssh-session:
    name: "Interactive Termius SSH Terminal"
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job limit: 6 hours

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Display Runner System Specs"
        run: |
          echo "=========================================================="
          echo "💻 GitHub Actions Runner VM Ready for Termius Connection"
          echo "   OS: $(lsb_release -d 2>/dev/null | cut -f2 || uname -s)"
          echo "   CPU Cores: $(nproc)"
          echo "   Total RAM: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "   Disk Space: $(df -h / | awk 'NR==2 {print $4}') available"
          echo "=========================================================="

      - name: "Launch Termius SSH Tunnel (Upterm)"
        uses: owenthereal/action-upterm@v1
        id: upterm
        with:
          detached: true
          limit-access-to-actor: false

      - name: "Enable Tmux Mouse Scrolling & Terminal Experience"
        run: |
          # Wait up to 5 seconds to ensure tmux session is up
          for i in {1..5}; do
            if tmux has-session -t upterm 2>/dev/null; then
              break
            fi
            sleep 1
          done

          # Enable mouse mode (scrolling, selecting, clicking)
          tmux set-option -g mouse on
          tmux set-option -t upterm mouse on 2>/dev/null || true
          tmux set-option -g history-limit 50000
          tmux set-option -t upterm history-limit 50000 2>/dev/null || true

          # Also write ~/.tmux.conf for new sessions/panes
          cat << 'EOF' > ~/.tmux.conf
          set -g mouse on
          set -g history-limit 50000
          EOF
          echo "✅ Mouse scrolling enabled: wheel/swipe will now scroll history buffer instead of cycling command history!"

      - name: "Format Termius Details & Send Notifications"
        env:
          INPUT_DISCORD: ${{ github.event.inputs.discord_webhook }}
          SECRET_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SSH_CMD: ${{ steps.upterm.outputs.ssh-command }}
        run: |
          DISCORD_WEBHOOK="${INPUT_DISCORD:-$SECRET_DISCORD}"

          # Parse SSH Command (format: ssh user@host)
          RAW_ADDR=$(echo "$SSH_CMD" | sed -e 's/^ssh //')
          SSH_USER=$(echo "$RAW_ADDR" | cut -d'@' -f1)
          SSH_HOST=$(echo "$RAW_ADDR" | cut -d'@' -f2)
          SSH_PORT="22"

          # ====================================================================
          # SECURITY: If Discord Webhook is provided, hide credentials from logs!
          # ====================================================================
          if [ -n "$DISCORD_WEBHOOK" ]; then
            # Mask user and command from public logs
            echo "::add-mask::$SSH_USER"
            echo "::add-mask::$SSH_CMD"

            echo ""
            echo "=========================================================="
            echo "🔒 SECURE MODE ACTIVE (Public Repo Protection)"
            echo "=========================================================="
            echo "   ✅ Upterm SSH Tunnel established successfully."
            echo "   📨 Full Termius connection details sent to Discord!"
            echo "   🛡️ Credentials and session tokens are HIDDEN from logs"
            echo "      to prevent strangers on GitHub from hijacking your runner."
            echo "=========================================================="
            echo ""

            # Write safe masked summary to GitHub
            echo "### 🔒 Secure Session Active" >> "$GITHUB_STEP_SUMMARY"
            echo "Connection credentials have been securely dispatched to your **Discord webhook**." >> "$GITHUB_STEP_SUMMARY"
            echo "> 🛡️ Details are masked in public logs to keep your runner safe from unauthorized access." >> "$GITHUB_STEP_SUMMARY"

            # Send private details directly to Discord
            curl -s -H "Content-Type: application/json" -X POST -d "{
              \"content\": \"🚀 **GitHub Actions Termius SSH Node Ready!**\\n\\n**Host:** \`$SSH_HOST\`\\n**Port:** \`$SSH_PORT\`\\n**User:** \`$SSH_USER\`\\n**Password:** *(Leave empty)*\\n**Full Command:**\\n\`$SSH_CMD\`\\n\\n🖱️ **Scrolling:** Mouse wheel or swipe scrolls history (50k lines). Hold \`Shift\` to select text.\"
            }" "$DISCORD_WEBHOOK" >/dev/null || true

          else
            # Fallback if no Discord webhook provided
            echo ""
            echo "=========================================================="
            echo "⚠️  WARNING: NO DISCORD WEBHOOK PROVIDED"
            echo "=========================================================="
            echo "   Hostname / IP: $SSH_HOST"
            echo "   Port:          $SSH_PORT"
            echo "   Username:      $SSH_USER"
            echo "   Password:      (Leave Empty)"
            echo "   Full Command:  $SSH_CMD"
            echo "=========================================================="
            echo "👉 TIP: Provide a discord_webhook input next time to hide"
            echo "   these credentials completely from public GitHub logs!"
            echo "=========================================================="
            echo ""

            # Add exact Termius fields to Step Summary
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📱 Enter these exact fields in Termius:" >> "$GITHUB_STEP_SUMMARY"
            echo "| Termius Field | Value to Enter |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Hostname / IP | \`$SSH_HOST\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Port | \`$SSH_PORT\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Username | \`$SSH_USER\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Password | *(Leave empty)* |" >> "$GITHUB_STEP_SUMMARY"
            echo "| SSH Key | *(None)* |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⏳ Session Lifetime: Up to 6 hours. To disconnect and stop the runner, type \`touch /tmp/keepalive_stop\` or cancel the run." >> "$GITHUB_STEP_SUMMARY"
            echo "> 🖱️ **Mouse Scrolling Enabled:** Use mouse wheel or swipe to scroll terminal history buffer (50,000 lines). Hold \`Shift\` to select text." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "⏳ Runner is now listening. Waiting for your SSH connection..."
          # Keep runner alive for up to 6 hours or until stopped
          while pgrep -f upterm >/dev/null && [ ! -f /tmp/keepalive_stop ]; do
            sleep 10
          done
          echo "Session finished."
